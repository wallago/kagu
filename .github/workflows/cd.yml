name: CD
on:
  push:
    tags:
      - "v*.*.*"
permissions:
  contents: write
concurrency:
  group: cd-${{ github.ref }}
jobs:
  firmware:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
  release:
    name: Publish the GitHub release
    needs: firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download the firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware
      - name: Collect the release assets
        shell: bash
        run: |
          mkdir -p assets
          cp firmware/*.uf2 assets/
          for side in left right; do
            cp "pcb/kagu-$side/kagu.kicad_pcb.zip" "assets/kagu-$side-gerbers.zip"
          done
      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          args: --latest --github-repo ${{ github.repository }}
        env:
          OUTPUT: CHANGES.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload the release assets
        uses: svenstaro/upload-release-action@v2
        with:
          file: assets/*
          file_glob: true
          overwrite: true
          tag: ${{ github.ref }}
          release_name: Kagu ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: ${{ steps.git-cliff.outputs.content }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
