# USB logging is a bring-up aid: it costs battery life and should be turned
# off for daily use.
CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_LOG_LEVEL_DBG=y

# Report the right half's battery level to the host as a second level.
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# 1.47" ST7789 status screen (see kagu_left.overlay for wiring).
CONFIG_ZMK_DISPLAY=y
# Custom status screen from src/status_screen.c (repo is a Zephyr module).
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_BAR=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_FONT_MONTSERRAT_28=y
# The screen shows the right half's battery too.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_Z_BITS_PER_PIXEL=16
# ZMK builds LVGL minimal, which leaves colour displays with no theme:
# black text on a black screen. The default dark theme gives white on black.
CONFIG_LV_USE_THEME_DEFAULT=y
CONFIG_LV_THEME_DEFAULT_DARK=y
# The theme and the screen's ~80 objects live in the LVGL pool (ZMK default: 4 KB).
CONFIG_LV_Z_MEM_POOL_SIZE=32768

# Screen backlight on PWM (BLK pin), off with the screen when idle.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_ON_START=y
CONFIG_ZMK_BACKLIGHT_BRT_START=80
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=y
